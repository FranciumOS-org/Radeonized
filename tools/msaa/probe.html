<!doctype html><html><head><meta charset="utf-8"><title>WebGL probe</title>
<style>body{font:13px ui-monospace,monospace;background:#111;color:#ddd;padding:12px}
#out{white-space:pre-wrap}canvas{border:1px solid #444;margin-top:8px}</style></head>
<body><canvas id="c" width="64" height="64"></canvas><div id="out">running…</div>
<script>
var L=[];function p(s){L.push(s);document.getElementById('out').textContent=L.join('\n');}
var c=document.getElementById('c'),gl=null,which='';
for (var n of ['webgl2','webgl','experimental-webgl']) {
  try { gl = c.getContext(n, {preserveDrawingBuffer:true}); } catch(e) { p(n+' threw: '+e); }
  if (gl) { which=n; break; }
}
p('context: '+(gl?which:'NONE - getContext returned null'));
if (gl) {
  var d=gl.getExtension('WEBGL_debug_renderer_info');
  p('VENDOR    : '+gl.getParameter(gl.VENDOR));
  p('RENDERER  : '+gl.getParameter(gl.RENDERER));
  p('VERSION   : '+gl.getParameter(gl.VERSION));
  if(d){p('UNMASKED_V: '+gl.getParameter(d.UNMASKED_VENDOR_WEBGL));
        p('UNMASKED_R: '+gl.getParameter(d.UNMASKED_RENDERER_WEBGL));}
  else p('UNMASKED  : extension absent');
  p('MAX_TEX   : '+gl.getParameter(gl.MAX_TEXTURE_SIZE));
  /* clear to a known colour and read the pixel back - the only real test */
  gl.clearColor(0.2,0.6,1.0,1.0); gl.clear(gl.COLOR_BUFFER_BIT);
  var px=new Uint8Array(4); gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
  p('clear readback: ['+px.join(',')+']  expect ~[51,153,255,255]');
  /* and a real draw: a full-screen triangle in solid green via a shader */
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))p('shader FAIL: '+gl.getShaderInfoLog(o));return o;}
  var vs=sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}');
  var fs=sh(gl.FRAGMENT_SHADER,'void main(){gl_FragColor=vec4(0.,1.,0.,1.);}');
  var pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))p('link FAIL: '+gl.getProgramInfoLog(pr));
  gl.useProgram(pr);
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var a=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.readPixels(32,32,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
  p('draw  readback: ['+px.join(',')+']  expect [0,255,0,255]');
  p('gl error: '+gl.getError()+' (0 = none)');
  c.addEventListener('webglcontextlost',function(){p('!! CONTEXT LOST');});
}
window.__webglProbe = L.join('\n');
try { fetch('/collect', {method:'POST', body:
  'UA: '+navigator.userAgent+'\n'+L.join('\n')}); } catch(e) {}
</script></body></html>
